[package]
name = "ardoise-gitlab"
version = "1.0.0"
edition = "2021"
rust-version = "1.90"
publish = false
description = "The GitLab plugin of Ardoise"
license = "MIT"

[[bin]]
name = "gitlab"
path = "src/main.rs"

[dependencies]
ardoise-plugin = { git = "https://github.com/ardoise-editor/plugin-sdk", tag = "v0.15.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-i18n = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust", "vendored"] }

[profile.release]
strip = true
lto = true

[dev-dependencies]
tempfile = "3"
